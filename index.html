<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WCA Live - Sum of Ranks</title>
    <link rel="stylesheet" href="https://cdn.cubing.net/v0/css/@cubing/icons/css">
    <style>
        :root {
            --wca-blue: #00427c;
            --wca-orange: #f57f20;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #666666;
            --border-color: #e0e0e0;
            --th-bg: #fafafa;
            --tr-hover: #f0f7ff;
            --podium-1-bg: #fcf8eb;
            --podium-2-bg: #f4f5f6;
            --podium-3-bg: #fcf6ef;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            width: 98%;
        }

        .header { text-align: center; margin-bottom: 25px; }

        .search-box {
            display: flex; gap: 10px; justify-content: center;
            margin-bottom: 20px; width: 100%; max-width: 500px;
            margin-left: auto; margin-right: auto;
        }

        .search-box input {
            flex: 1; padding: 12px 15px; font-size: 16px;
            border: 1px solid var(--border-color); border-radius: 6px;
            outline: none; min-width: 0; background-color: var(--card-bg);
            color: var(--text-main);
        }

        .search-box button {
            padding: 12px 20px; font-size: 16px;
            background-color: var(--wca-blue); color: white;
            border: none; border-radius: 6px; cursor: pointer;
            transition: opacity 0.2s; white-space: nowrap;
        }
        .search-box button:hover { opacity: 0.85; }

        .tabs {
            display: flex; justify-content: center; flex-wrap: wrap;
            gap: 5px; margin-bottom: 12px; border-bottom: 2px solid var(--border-color);
            padding-bottom: 10px;
        }

        .tab-btn {
            background: none; border: none; padding: 10px 15px;
            font-size: 16px; font-weight: bold; color: var(--text-muted);
            cursor: pointer; border-radius: 6px; transition: all 0.2s;
            flex: 1 1 auto; text-align: center;
        }
        .tab-btn:hover { background-color: #e9ecef; }
        .tab-btn.active { background-color: var(--wca-blue); color: #fff; }

        /* Botón de Proyector */
        .controls-container {
            display: flex; justify-content: flex-end; align-items: center;
            gap: 10px; margin-bottom: 12px; padding-right: 4px;
        }

        .icon-btn {
            position: relative;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-main);
            transition: all 0.2s;
            padding: 0;
        }

        .icon-btn:hover {
            background-color: #e9ecef;
            border-color: #c5c5c5;
        }

        .icon-btn.active {
            background-color: var(--wca-blue);
            border-color: var(--wca-blue);
            color: #ffffff;
        }

        .icon-btn svg {
            width: 22px;
            height: 22px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .icon-btn::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 115%;
            left: 50%;
            transform: translateX(-50%);
            background-color: #222;
            color: #fff;
            font-size: 12px;
            font-weight: 600;
            padding: 5px 9px;
            border-radius: 5px;
            white-space: nowrap;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s ease;
            z-index: 100;
        }

        .icon-btn:hover::after {
            opacity: 1;
        }

        /* Contenedor de tabla con scroll y cabeceras/columnas fijas */
        .table-container {
            background-color: var(--card-bg);
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            overflow: auto;
            max-height: 72vh;
            -webkit-overflow-scrolling: touch;
            width: 100%;
        }

        table {
            width: max-content;
            min-width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            table-layout: auto;
        }

        th, td {
            padding: 12px 10px; text-align: left;
            border-bottom: 1px solid var(--border-color); white-space: nowrap;
        }

        thead th {
            position: sticky;
            top: 0;
            z-index: 10;
            background-color: var(--th-bg);
            font-weight: 600;
            color: var(--text-muted);
            box-shadow: 0 1px 0 var(--border-color);
            user-select: none;
        }

        thead th.sortable {
            cursor: pointer;
            transition: background-color 0.15s, color 0.15s;
        }

        thead th.sortable:hover {
            background-color: #eef3f8;
        }

        thead th.sort-active {
            box-shadow: inset 0 -2px 0 var(--wca-blue), 0 1px 0 var(--border-color);
        }

        thead th.sort-active .matrix-header-icon {
            color: var(--wca-blue);
        }

        tbody tr { cursor: pointer; background-color: var(--card-bg); transition: background 0.1s; }
        tbody tr:hover { background-color: var(--tr-hover); }

        /* Columnas fijas a la izquierda (Rank y Competidor) */
        .rank-col {
            position: sticky;
            left: 0;
            width: 50px;
            min-width: 50px;
            max-width: 50px;
            text-align: center;
            font-weight: bold;
            z-index: 5;
            background-color: inherit;
        }

        .name-col {
            position: sticky;
            left: 50px;
            max-width: 280px;
            overflow: hidden;
            text-overflow: ellipsis;
            z-index: 5;
            background-color: inherit;
            box-shadow: 2px 0 4px -2px rgba(0, 0, 0, 0.12);
        }

        thead th.rank-col,
        thead th.name-col {
            z-index: 20;
            background-color: var(--th-bg);
        }

        /* Resaltado sutil de podio (colores opacos para que no se transparente al scrollear) */
        tbody tr.podium-1 { background-color: var(--podium-1-bg); }
        tbody tr.podium-1 td.rank-col { border-left: 4px solid #d4a017; color: #b8860b; }

        tbody tr.podium-2 { background-color: var(--podium-2-bg); }
        tbody tr.podium-2 td.rank-col { border-left: 4px solid #8c969e; color: #6c757d; }

        tbody tr.podium-3 { background-color: var(--podium-3-bg); }
        tbody tr.podium-3 td.rank-col { border-left: 4px solid #cd7f32; color: #a05a1c; }

        tbody tr.podium-1:hover,
        tbody tr.podium-2:hover,
        tbody tr.podium-3:hover { background-color: var(--tr-hover); }

        .score-col { width: 75px; min-width: 75px; text-align: right; font-weight: bold; color: var(--wca-orange); }

        .projector-ctrl-btn {
            background: transparent;
            border: 1px solid transparent;
            border-radius: 6px;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            opacity: 0.4;
        }

        .projector-ctrl-btn:hover {
            opacity: 1;
            background-color: #e9ecef;
            color: var(--text-main);
        }

        .projector-ctrl-btn.paused {
            opacity: 1;
            color: var(--wca-orange);
            background-color: rgba(245, 127, 32, 0.12);
            border-color: rgba(245, 127, 32, 0.35);
        }

        .projector-ctrl-btn.close-proj:hover {
            color: #e74c3c;
            background-color: rgba(231, 76, 60, 0.1);
        }

        .projector-ctrl-btn svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .matrix-cell {
            width: 44px; min-width: 44px; text-align: center;
            padding-left: 4px !important; padding-right: 4px !important;
        }
        .matrix-header-icon { font-size: 18px; color: var(--text-muted); }
        .matrix-penalty { color: #e74c3c; font-weight: bold; }
        .matrix-rank { color: var(--text-main); }

        /* Colores de metales para 1º, 2º y 3º en la matriz */
        .medal-1 { color: #b8860b; font-weight: normal; }
        .medal-2 { color: #7f8c8d; font-weight: normal; }
        .medal-3 { color: #b86b28; font-weight: normal; }

        /* Modal */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5); align-items: center; justify-content: center;
            z-index: 1000; padding: 15px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: var(--card-bg); padding: 25px; border-radius: 10px;
            width: 100%; max-width: 350px; box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            position: relative;
        }
        .close-btn {
            position: absolute; top: 15px; right: 15px; background: none;
            border: none; font-size: 20px; cursor: pointer; color: var(--text-muted);
        }
        .modal h2 {
            margin-top: 0; margin-bottom: 25px; color: var(--wca-blue);
            text-align: center; font-size: 1.2rem; padding-right: 20px;
        }
        .breakdown-list {
            list-style: none; padding: 0; margin: 0; max-height: 60vh; overflow-y: auto;
        }
        .breakdown-list li {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 15px; border-bottom: 1px dashed var(--border-color); font-size: 18px;
        }
        .breakdown-list li:last-child { border-bottom: none; }
        .cubing-icon { font-size: 24px; color: var(--text-muted); }
        .status { text-align: center; color: var(--text-muted); margin: 20px 0; font-style: italic; }

        /* --- MODO PROYECTOR --- */
        body.projector-mode .header,
        body.projector-mode .search-box,
        body.projector-mode .tabs,
        body.projector-mode .controls-container {
            display: none !important;
        }

        body.projector-mode {
            padding: 0;
            background-color: var(--card-bg);
            overflow: hidden;
        }

        body.projector-mode .container {
            max-width: 100%; width: 100%; margin: 0;
        }

        body.projector-mode .table-container {
            border-radius: 0;
            box-shadow: none;
            max-height: 100vh;
            height: 100vh;
            overflow: hidden;
        }

        body.projector-mode th {
            font-size: 1.55rem;
            padding: 14px 16px;
        }

        body.projector-mode td {
            font-size: 1.65rem;
            padding: 0 16px;
        }

        body.projector-mode .rank-col,
        body.projector-mode .name-col {
            position: static;
            box-shadow: none;
            max-width: none;
        }

        body.projector-mode .score-col { width: auto; }
        body.projector-mode .matrix-header-icon { font-size: 26px; }
        body.projector-mode .matrix-cell { width: 58px; min-width: 58px; }
        .projector-close-col { width: 48px; min-width: 48px; text-align: center; padding: 0 8px !important; }
        .projector-pause-col { width: 44px; min-width: 44px; text-align: right; padding: 0 4px !important; }

        /* Animaciones: sale hacia la izquierda, entra desde la derecha */
        @keyframes slideOutLeft {
            from { opacity: 1; transform: translateX(0); }
            to { opacity: 0; transform: translateX(-80px); }
        }

        @keyframes slideInFromRight {
            from { opacity: 0; transform: translateX(80px); }
            to { opacity: 1; transform: translateX(0); }
        }

        tr.slide-out-left {
            animation: slideOutLeft 0.35s ease forwards;
        }

        tr.slide-in-right {
            opacity: 0;
            animation: slideInFromRight 0.35s ease forwards;
        }

        @media (max-width: 600px) {
            body { padding: 10px; }
            .header h1 { font-size: 1.5rem; }
            .search-box { flex-direction: column; }
            .search-box input, .search-box button { width: 100%; text-align: center; }
            .tab-btn { padding: 8px 10px; font-size: 14px; }
            th, td { padding: 10px 6px; font-size: 14px; }
            .rank-col { width: 42px; min-width: 42px; max-width: 42px; }
            .name-col { left: 42px; max-width: 145px; }
            .matrix-cell { width: 42px; min-width: 42px; padding: 10px 4px !important; }
            .table-container { max-height: 68vh; }
        }

        body.projector-mode.hide-cursor,
        body.projector-mode.hide-cursor * {
            cursor: none !important;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1 id="pageTitle">WCA Live - Sum of Ranks</h1>
    </div>

    <div class="search-box">
        <input type="text" id="compId" placeholder="ID de la competición" />
        <button onclick="fetchCompetitionData(false)">Cargar Datos</button>
    </div>

    <div id="statusMessage" class="status">Introduce el ID oficial para ver los resultados.</div>

    <div id="appContent" style="display: none;">
        <div class="tabs" id="tabsContainer">
            <button class="tab-btn active" onclick="setTab('general')">General</button>
            <button class="tab-btn" onclick="setTab('nxnxn')">NxNxN</button>
            <button class="tab-btn" onclick="setTab('side')">Side Events</button>
            <button class="tab-btn" onclick="setTab('quiet')">Quiet Events</button>
        </div>

        <div class="controls-container">
            <button id="projectorBtn" class="icon-btn" data-tooltip="Modo Proyector" onclick="toggleProjectorMode(true)" aria-label="Modo Proyector">
                <svg viewBox="0 0 24 24">
                    <rect x="2" y="8" width="20" height="9" rx="2"></rect>
                    <circle cx="16" cy="12.5" r="2.2"></circle>
                    <line x1="6" y1="12.5" x2="10" y2="12.5"></line>
                    <line x1="6" y1="17" x2="5" y2="20"></line>
                    <line x1="18" y1="17" x2="19" y2="20"></line>
                </svg>
            </button>
        </div>

        <div class="table-container">
            <table id="mainTable">
                <thead id="tableHead"><tr id="tableHeaderRow"></tr></thead>
                <tbody id="rankingTable"></tbody>
            </table>
        </div>
    </div>
</div>

<div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
        <button class="close-btn" onclick="closeModal(event)">×</button>
        <h2 id="modalCompetitorName">Nombre</h2>
        <ul class="breakdown-list" id="modalBreakdown"></ul>
    </div>
</div>

<script>
    const EVENT_GROUPS = {
        'nxnxn': ['333', '222', '444', '555', '666', '777'],
        'side': ['333oh', 'clock', 'fto', 'minx', 'pyram', 'skewb', 'sq1'],
        'quiet': ['333bf', '333fm', '444bf', '555bf', '333mbf']
    };

    const TAB_KEYS = {
        '1': 'general',
        '2': 'nxnxn',
        '3': 'side',
        '4': 'quiet'
    };

    const PAUSE_SVG = `<svg viewBox="0 0 24 24"><rect x="6" y="4" width="4" height="16" rx="1"></rect><rect x="14" y="4" width="4" height="16" rx="1"></rect></svg>`;
    const PLAY_SVG = `<svg viewBox="0 0 24 24"><polygon points="6,4 20,12 6,20"></polygon></svg>`;
    const CLOSE_SVG = `<svg viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>`;

    let competitionId = '';
    let globalData = {};
    let currentTab = 'general';
    let currentSort = 'score';
    let isProjectorMode = false;
    let isProjectorPaused = false;

    let projectorPage = 0;
    let projectorTimer = null;
    let autoRefreshInterval = null;
    let currentRankingsCache = [];
    let wakeLock = null;
    let cursorTimer = null;

    window.onload = () => {
        document.getElementById('compId').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') fetchCompetitionData(false);
        });

        document.addEventListener('fullscreenchange', () => {
            if (!document.fullscreenElement && isProjectorMode) {
                toggleProjectorMode(false);
            }
        });

        document.addEventListener('keydown', (e) => {
            if (!isProjectorMode) return;

            if (e.key === 'Escape') {
                toggleProjectorMode(false);
            } else if (e.code === 'Space') {
                e.preventDefault();
                toggleProjectorPause();
            } else if (e.key === 'ArrowRight') {
                e.preventDefault();
                changeProjectorPageManual(1);
            } else if (e.key === 'ArrowLeft') {
                e.preventDefault();
                changeProjectorPageManual(-1);
            } else if (TAB_KEYS[e.key]) {
                e.preventDefault();
                setTab(TAB_KEYS[e.key]);
                if (!isProjectorPaused) startProjectorCycle();
            }
        });

        window.addEventListener('resize', () => {
            if (isProjectorMode) {
                projectorPage = 0;
                renderProjectorPage(false);
            }
        });

        document.addEventListener('mousemove', resetCursorTimer);

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible' && isProjectorMode) {
                requestWakeLock();
            }
        }); 

        const urlParams = new URLSearchParams(window.location.search);
        const compParam = urlParams.get('comp');
        if (compParam) {
            document.getElementById('compId').value = compParam;
            fetchCompetitionData(false);
        }
    };

    function startAutoRefresh() {
        if (autoRefreshInterval) clearInterval(autoRefreshInterval);
        autoRefreshInterval = setInterval(() => {
            if (competitionId && !document.hidden) {
                fetchCompetitionData(true);
            }
        }, 60000);
    }

    function changeProjectorPageManual(delta) {
        const { rowsPerPage } = getProjectorLayout();
        const totalPages = Math.ceil(currentRankingsCache.length / rowsPerPage);
        if (totalPages <= 1) return;

        projectorPage = (projectorPage + delta + totalPages) % totalPages;
        renderProjectorPage(false);
        if (!isProjectorPaused) startProjectorCycle();
    }

    function setSort(sortKey) {
        if (sortKey === 'score') {
            currentSort = 'score';
        } else {
            currentSort = (currentSort === sortKey) ? 'score' : sortKey;
        }
        projectorPage = 0;
        renderTable();
    }

    async function requestWakeLock() {
        if ('wakeLock' in navigator) {
            try {
                wakeLock = await navigator.wakeLock.request('screen');
            } catch (err) {}
        }
    }

    function releaseWakeLock() {
        if (wakeLock) {
            wakeLock.release().catch(() => {});
            wakeLock = null;
        }
    }

    function resetCursorTimer() {
        if (!isProjectorMode) return;
        document.body.classList.remove('hide-cursor');
        clearTimeout(cursorTimer);
        cursorTimer = setTimeout(() => {
            if (isProjectorMode) document.body.classList.add('hide-cursor');
        }, 3000);
    }

    function toggleProjectorMode(turnOn) {
        isProjectorMode = turnOn;
        isProjectorPaused = false;
        const btn = document.getElementById('projectorBtn');
        btn.classList.toggle('active', turnOn);

        if (turnOn) {
            document.body.classList.add('projector-mode');
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {});
            }
            projectorPage = 0;
            renderTable();
            startProjectorCycle();
            requestWakeLock();
            resetCursorTimer();
        } else {
            document.body.classList.remove('projector-mode', 'hide-cursor');
            clearTimeout(cursorTimer);
            releaseWakeLock();
            if (document.fullscreenElement) {
                document.exitFullscreen().catch(() => {});
            }
            stopProjectorCycle();
            renderTable();
        }
    }

    function toggleProjectorPause() {
        if (!isProjectorMode) return;
        isProjectorPaused = !isProjectorPaused;

        if (isProjectorPaused) {
            stopProjectorCycle();
        } else {
            startProjectorCycle();
        }

        const pauseBtn = document.getElementById('projectorPauseBtn');
        if (pauseBtn) {
            pauseBtn.innerHTML = isProjectorPaused ? PLAY_SVG : PAUSE_SVG;
            pauseBtn.classList.toggle('paused', isProjectorPaused);
            pauseBtn.title = isProjectorPaused ? 'Reanudar' : 'Pausar';
        }
    }

    function getProjectorLayout() {
        const thead = document.getElementById('tableHead');
        const headerHeight = thead ? thead.getBoundingClientRect().height : 62;
        const availableHeight = window.innerHeight - headerHeight;
        const targetRowHeight = 68;
        const rowsPerPage = Math.max(5, Math.floor(availableHeight / targetRowHeight));
        const exactRowHeight = availableHeight / rowsPerPage;
        return { rowsPerPage, exactRowHeight };
    }

    function startProjectorCycle() {
        stopProjectorCycle();
        if (isProjectorPaused) return;

        projectorTimer = setInterval(() => {
            if (isProjectorPaused) return;

            const { rowsPerPage } = getProjectorLayout();
            const totalPages = Math.ceil(currentRankingsCache.length / rowsPerPage);
            if (totalPages <= 1) return;

            const rows = document.querySelectorAll('#rankingTable tr');
            rows.forEach((tr, i) => {
                tr.classList.remove('slide-in-right');
                tr.style.animationDelay = `${i * 30}ms`;
                tr.classList.add('slide-out-left');
            });

            const totalExitTime = 350 + (rows.length * 30);
            setTimeout(() => {
                if (!isProjectorMode) return;
                projectorPage = (projectorPage + 1) % totalPages;
                renderProjectorPage(true);
            }, totalExitTime);

        }, 7000);
    }

    function stopProjectorCycle() {
        if (projectorTimer) {
            clearInterval(projectorTimer);
            projectorTimer = null;
        }
    }

    async function fetchCompetitionData(isSilent = false) {
        const input = document.getElementById('compId').value.trim();
        if (!input) return;

        competitionId = input;
        const url = new URL(window.location);
        url.searchParams.set('comp', competitionId);
        window.history.pushState({}, '', url);

        const statusEl = document.getElementById('statusMessage');
        const contentEl = document.getElementById('appContent');

        if (!isSilent) {
            statusEl.innerText = "Descargando datos oficiales de la WCA...";
            statusEl.style.color = '#666';
            statusEl.style.display = 'block';
            contentEl.style.display = 'none';
        }

        try {
            const response = await fetch(`https://www.worldcubeassociation.org/api/v0/competitions/${competitionId}/wcif/public`);

            if (!response.ok) {
                if (response.status === 404) throw new Error("Competición no encontrada.");
                throw new Error(`Error del servidor WCA: ${response.status}`);
            }

            const wcifData = await response.json();
            processData(wcifData);

            const compName = wcifData.name || competitionId;
            document.getElementById('pageTitle').innerText = `${compName} - Sum of Ranks`;
            document.title = `${compName} - Sum of Ranks`;

            if (!isSilent) {
                statusEl.style.display = 'none';
                contentEl.style.display = 'block';
                setTab('general');
                startAutoRefresh();
            } else {
                calculateRankings();
                if (isProjectorMode) {
                    renderProjectorPage(false);
                } else {
                    renderTable();
                }
            }

        } catch (error) {
            if (!isSilent) {
                statusEl.style.display = 'block';
                statusEl.style.color = '#e74c3c';
                statusEl.innerText = error.message;
            }
        }
    }

    function processData(wcif) {
        const competitors = {};
        const eventMaxRanks = {};
        const activeEvents = new Set();
        const personsMap = {};

        if (wcif.persons) {
            wcif.persons.forEach(p => {
                if (p.registrantId !== null && p.registrantId !== undefined) personsMap[p.registrantId] = p.name;
            });
        }

        if (wcif.events) {
            wcif.events.forEach(event => {
                const eventId = event.id;
                let hasResults = false;

                if (!event.rounds || event.rounds.length === 0) return;

                const firstRoundParticipants = event.rounds[0].results ? event.rounds[0].results.length : 0;

                event.rounds.forEach(round => {
                    if (!round.results || round.results.length === 0) return;

                    hasResults = true;
                    const participantsInThisRound = round.results.length;

                    round.results.forEach(result => {
                        const pId = result.personId;
                        const pName = personsMap[pId] || "Competidor Desconocido";
                        const rank = result.ranking;

                        if (!competitors[pId]) competitors[pId] = { name: pName, events: {} };

                        if (rank) {
                            competitors[pId].events[eventId] = rank;
                        } else {
                            competitors[pId].events[eventId] = participantsInThisRound + 1;
                        }
                    });
                });

                if (hasResults) {
                    activeEvents.add(eventId);
                    eventMaxRanks[eventId] = firstRoundParticipants + 1;
                }
            });
        }
        globalData = { competitors, eventMaxRanks, activeEvents };
    }

    function setTab(tabName) {
        currentTab = tabName;
        currentSort = 'score';
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelector(`.tab-btn[onclick="setTab('${tabName}')"]`).classList.add('active');
        projectorPage = 0;
        renderTable();
    }

    function getEventsForCurrentTab() {
        if (!globalData.activeEvents) return [];
        if (currentTab === 'general') {
            return Array.from(globalData.activeEvents);
        }
        return EVENT_GROUPS[currentTab].filter(e => globalData.activeEvents.has(e));
    }

    function calculateRankings() {
        const targetEvents = getEventsForCurrentTab();
        const rankings = [];

        if (targetEvents.length === 0 || !globalData.competitors) {
            currentRankingsCache = [];
            return;
        }

        for (const [pId, data] of Object.entries(globalData.competitors)) {
            let totalScore = 0;
            let participatedInTab = false;

            targetEvents.forEach(eventId => {
                if (data.events[eventId]) {
                    totalScore += data.events[eventId];
                    participatedInTab = true;
                } else {
                    totalScore += globalData.eventMaxRanks[eventId];
                }
            });

            if (participatedInTab) {
                rankings.push({ id: pId, name: data.name, score: totalScore, breakdown: data.events });
            }
        }

        rankings.sort((a, b) => a.score - b.score);

        let currentRank = 1;
        rankings.forEach((competitor, index) => {
            if (index > 0 && competitor.score > rankings[index - 1].score) currentRank = index + 1;
            competitor.displayRank = currentRank;
        });

        if (currentSort !== 'score' && targetEvents.includes(currentSort)) {
            const penalty = globalData.eventMaxRanks[currentSort];
            rankings.sort((a, b) => {
                const valA = a.breakdown[currentSort] || penalty;
                const valB = b.breakdown[currentSort] || penalty;
                if (valA !== valB) return valA - valB;
                return a.score - b.score;
            });
        }

        currentRankingsCache = rankings;
    }

    function renderHeader(targetEvents) {
        const headerRow = document.getElementById('tableHeaderRow');
        headerRow.innerHTML = '';

        const thRank = document.createElement('th'); thRank.className = 'rank-col'; thRank.innerText = 'Rank';
        const thName = document.createElement('th'); thName.className = 'name-col'; thName.innerText = 'Competidor';

        headerRow.appendChild(thRank);
        headerRow.appendChild(thName);

        if (isProjectorMode) {
            const thPause = document.createElement('th');
            thPause.className = 'projector-pause-col';

            const pauseBtn = document.createElement('button');
            pauseBtn.id = 'projectorPauseBtn';
            pauseBtn.className = `projector-ctrl-btn${isProjectorPaused ? ' paused' : ''}`;
            pauseBtn.title = isProjectorPaused ? 'Reanudar' : 'Pausar';
            pauseBtn.innerHTML = isProjectorPaused ? PLAY_SVG : PAUSE_SVG;
            pauseBtn.onclick = (e) => {
                e.stopPropagation();
                toggleProjectorPause();
            };

            thPause.appendChild(pauseBtn);
            headerRow.appendChild(thPause);
        }

        const thScore = document.createElement('th');
        thScore.className = 'score-col sortable' + (currentSort === 'score' ? ' sort-active' : '');
        thScore.innerText = 'Puntos';
        thScore.onclick = () => setSort('score');
        headerRow.appendChild(thScore);

        targetEvents.forEach(eventId => {
            const th = document.createElement('th');
            th.className = 'matrix-cell sortable' + (currentSort === eventId ? ' sort-active' : '');
            th.innerHTML = `<span class="cubing-icon event-${eventId} matrix-header-icon"></span>`;
            th.onclick = () => setSort(eventId);
            headerRow.appendChild(th);
        });

        if (isProjectorMode) {
            const thClose = document.createElement('th');
            thClose.className = 'projector-close-col';

            const closeBtn = document.createElement('button');
            closeBtn.className = 'projector-ctrl-btn close-proj';
            closeBtn.title = 'Salir del Proyector';
            closeBtn.innerHTML = CLOSE_SVG;
            closeBtn.onclick = (e) => {
                e.stopPropagation();
                toggleProjectorMode(false);
            };

            thClose.appendChild(closeBtn);
            headerRow.appendChild(thClose);
        }
    }

    function buildRow(competitor, targetEvents) {
        const tr = document.createElement('tr');
        if (competitor.displayRank >= 1 && competitor.displayRank <= 3) {
            tr.classList.add(`podium-${competitor.displayRank}`);
        }
        tr.onclick = () => { if (!isProjectorMode) openModal(competitor); };

        const tdRank = document.createElement('td'); tdRank.className = 'rank-col'; tdRank.innerText = competitor.displayRank;
        const tdName = document.createElement('td'); tdName.className = 'name-col'; tdName.title = competitor.name; tdName.innerText = competitor.name;
        const tdScore = document.createElement('td'); tdScore.className = 'score-col'; tdScore.innerText = competitor.score;

        tr.appendChild(tdRank);
        tr.appendChild(tdName);

        if (isProjectorMode) {
            const tdPause = document.createElement('td');
            tdPause.className = 'projector-pause-col';
            tr.appendChild(tdPause);
        }

        tr.appendChild(tdScore);

        targetEvents.forEach(eventId => {
            const td = document.createElement('td');
            td.className = 'matrix-cell';
            if (competitor.breakdown[eventId]) {
                const rankVal = competitor.breakdown[eventId];
                const medalClass = (rankVal >= 1 && rankVal <= 3) ? ` medal-${rankVal}` : '';
                td.innerHTML = `<span class="matrix-rank${medalClass}">${rankVal}</span>`;
            } else {
                td.innerHTML = `<span class="matrix-penalty">${globalData.eventMaxRanks[eventId]}</span>`;
            }
            tr.appendChild(td);
        });

        if (isProjectorMode) {
            const tdClose = document.createElement('td');
            tdClose.className = 'projector-close-col';
            tr.appendChild(tdClose);
        }

        return tr;
    }

    function renderTable() {
        const targetEvents = getEventsForCurrentTab();
        renderHeader(targetEvents);
        calculateRankings();

        if (isProjectorMode) {
            renderProjectorPage(false);
            return;
        }

        const tbody = document.getElementById('rankingTable');
        tbody.innerHTML = '';

        if (currentRankingsCache.length === 0) {
            const emptyTr = document.createElement('tr');
            const emptyTd = document.createElement('td');
            emptyTd.colSpan = 3 + targetEvents.length;
            emptyTd.style.textAlign = 'center';
            emptyTd.innerText = 'No hay resultados para esta categoría.';
            emptyTr.appendChild(emptyTd);
            tbody.appendChild(emptyTr);
            return;
        }

        currentRankingsCache.forEach(competitor => {
            tbody.appendChild(buildRow(competitor, targetEvents));
        });
    }

    function renderProjectorPage(animateIn = true) {
        const targetEvents = getEventsForCurrentTab();
        const tbody = document.getElementById('rankingTable');
        tbody.innerHTML = '';

        const { rowsPerPage, exactRowHeight } = getProjectorLayout();
        const totalPages = Math.max(1, Math.ceil(currentRankingsCache.length / rowsPerPage));
        if (projectorPage >= totalPages) projectorPage = 0;

        const start = projectorPage * rowsPerPage;
        const pageItems = currentRankingsCache.slice(start, start + rowsPerPage);

        pageItems.forEach((competitor, i) => {
            const tr = buildRow(competitor, targetEvents);
            tr.style.height = `${exactRowHeight}px`;
            if (animateIn) {
                tr.style.animationDelay = `${i * 35}ms`;
                tr.classList.add('slide-in-right');
            }
            tbody.appendChild(tr);
        });
    }

    function openModal(competitor) {
        document.getElementById('modalCompetitorName').innerText = competitor.name;
        const list = document.getElementById('modalBreakdown');
        list.innerHTML = '';
        const targetEvents = getEventsForCurrentTab();

        targetEvents.forEach(eventId => {
            const li = document.createElement('li');
            const eventIcon = document.createElement('span'); eventIcon.className = `cubing-icon event-${eventId}`;
            const eventScore = document.createElement('strong');
            if (competitor.breakdown[eventId]) {
                const rankVal = competitor.breakdown[eventId];
                eventScore.innerText = rankVal;
                if (rankVal === 1) eventScore.style.color = '#b8860b';
                else if (rankVal === 2) eventScore.style.color = '#7f8c8d';
                else if (rankVal === 3) eventScore.style.color = '#b86b28';
                else eventScore.style.color = 'var(--text-main)';
            } else {
                eventScore.innerText = globalData.eventMaxRanks[eventId];
                eventScore.style.color = '#e74c3c';
            }
            li.appendChild(eventIcon); li.appendChild(eventScore); list.appendChild(li);
        });
        document.getElementById('modalOverlay').classList.add('active');
    }

    function closeModal(event) {
        if (event.target.classList.contains('modal-overlay') || event.target.classList.contains('close-btn')) {
            document.getElementById('modalOverlay').classList.remove('active');
        }
    }
</script>
